<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var p = new URLSearchParams(location.search).get('theme');
          var s =
            p === 'dark' || p === 'light'
              ? p
              : localStorage.getItem('laymor_theme') || localStorage.getItem('printsim_theme');
          var m = document.querySelector('meta[name="color-scheme"]');
          if (m) m.content = s === 'dark' || s === 'light' ? s : 'light dark';
          var r =
            s === 'dark' || s === 'light'
              ? s
              : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme', r);
          document.documentElement.classList.toggle('dark', r === 'dark');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LAYMOR 3D Print Simulator — Mô Phỏng Cắt Lớp &amp; Tree Support Thời Gian Thực</title>
    <meta
      name="description"
      content="Buồng mô phỏng in 3D LAYMOR CoreXY thời gian thực: cắt lớp 2D-SDF, dựng Tree Support tự động, kiểm tra góc Overhang và xuất file .3MF chuẩn Bambu Studio."
    />
  </head>
  <body class="overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
